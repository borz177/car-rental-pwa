
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <title>AutoPro AI - Car Rental</title>
    <script>
      // Синхронно, до первой отрисовки — иначе при сохранённой тёмной теме страница на
      // мгновение мигает светлой вёрсткой, пока не отработает React и не проставит класс.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var isDark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <link rel="manifest" href="/metadata.json">
    <!-- Стили, иконки и шрифт больше не грузятся с внешних CDN: они собираются
         в бандл из index.css и раздаются с этого же домена. Раньше страница
         зависела от cdn.tailwindcss.com, cdnjs.cloudflare.com и fonts.googleapis.com —
         недоступность любого из них в сети пользователя оставляла приложение без
         оформления. Importmap на esm.sh убран по той же причине: Vite и так
         резолвит react/recharts из бандла, а в сыром HTML он больше не нужен. -->
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-gray-900 dark:text-slate-100 overflow-x-hidden selection:bg-blue-100">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
